name: Sync Secrets to Mekan Radari
on:
  workflow_dispatch:
    inputs:
      pat_token:
        description: 'GitHub PAT'
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Secret Sync
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          PAT_TOKEN: ${{ inputs.pat_token }}
        run: |
          npm install tweetsodium
          node -e "
          const sodium = require('tweetsodium');
          const token = process.env.PAT_TOKEN;
          const owner = 'cosskun';
          const repo = 'mekan_radari';

          const secrets = {
            'APP_STORE_CONNECT_KEY_ID': process.env.KEY_ID,
            'APP_STORE_CONNECT_ISSUER_ID': process.env.ISSUER_ID,
            'APP_STORE_CONNECT_PRIVATE_KEY': process.env.PRIVATE_KEY
          };

          async function setSecret(name, value) {
            const pkRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/actions/secrets/public-key', {
              headers: { 'Authorization': 'token ' + token, 'User-Agent': 'NodeJS', 'Accept': 'application/vnd.github.v3+json' }
            });
            const { key, key_id } = await pkRes.json();
            const messageBytes = Buffer.from(value);
            const keyBytes = Buffer.from(key, 'base64');
            const encryptedBytes = sodium.seal(messageBytes, keyBytes);
            const encrypted = Buffer.from(encryptedBytes).toString('base64');

            const putRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/actions/secrets/' + name, {
              method: 'PUT',
              headers: {
                'Authorization': 'token ' + token,
                'User-Agent': 'NodeJS',
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ encrypted_value: encrypted, key_id: key_id })
            });
            console.log('Secret', name, 'status:', putRes.status);
          }

          async function run() {
            for (const [k, v] of Object.entries(secrets)) {
              await setSecret(k, v);
            }
          }
          run().catch(console.error);
          "
